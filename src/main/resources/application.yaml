spring:
  application:
    name: brtickets
  datasource:
    url: jdbc:postgresql://localhost:5432/brticketsmono
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  docker:
    compose:
      enabled: false
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
